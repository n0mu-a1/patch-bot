<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff8dc">
  <title>あそびハブ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hub" aria-labelledby="hub-title">
    <h1 id="hub-title">あそびハブ</h1>
    <nav class="game-list" aria-label="ゲーム">
      <a class="game-card kana-card" href="./hiragana/">
        <img src="hiragana/icon.svg" alt="" width="72" height="72">
        <span>ひらがな<br>おとあて</span>
      </a>
      <a class="game-card reflex-card" href="./reflex/">
        <img src="reflex/icon.svg" alt="" width="72" height="72">
        <span>しゅんぱつ<br>ラボ</span>
      </a>
    </nav>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
