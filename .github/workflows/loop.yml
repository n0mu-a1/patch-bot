name: reflex-lab autopatch loop

# プレイヤーの声(Turso) → 分類/gate → game-config.js 自動パッチ → PR自動マージ → Vercel自動デプロイ。
# gate を通らない/ロジック要望は issue 化して人間承認へ落とす（事故防止）。

on:
  schedule:
    - cron: "0 */6 * * *" # 6時間ごと (UTC)
  workflow_dispatch: {} # 手動トリガ（初回検証用）

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: reflex-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Migrate DB (idempotent)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node db/migrate.mjs

      - name: Run autopatch loop
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # コメント分類のコスト方針: 既定(auto)は無料のみ。
          #   GROQ_API_KEY 有 → Groq 無料枠でLLM分類 / 無 → キー不要の heuristic。どちらも $0。
          #   有料の Anthropic を使う時だけ REFLEX_NLP_PROVIDER=anthropic を設定する。
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REFLEX_NLP_PROVIDER: ${{ vars.REFLEX_NLP_PROVIDER }}
        run: |
          for g in reflex hiragana; do
            node loop/run.mjs --game "$g" --apply || true
          done

      - name: Act on decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed=false

          for f in reflex/decision.json hiragana/decision.json; do
            if [ ! -f "$f" ]; then echo "$f なし→スキップ"; continue; fi
            GAME=$(jq -r '.game // "unknown"' "$f")
            ACTION=$(jq -r '.action // "noop"' "$f")
            APPLIED=$(jq -r '.applied // false' "$f")
            echo "$GAME: action=$ACTION applied=$APPLIED"

            if [ "$ACTION" = "patch" ] && [ "$APPLIED" = "true" ]; then
              changed=true
            elif [ "$ACTION" = "patch" ]; then
              echo "$GAME: patch だが applied≠true（ファイル未書込）→ git操作なし"
            elif [ "$ACTION" = "escalate" ]; then
              TITLE=$(jq -r --arg g "$GAME" '.issueTitle // "[reflex-lab:" + $g + "] 人間承認が必要"' "$f")
              jq -r '.issueBody // .reason // ""' "$f" > "/tmp/issue-body-${GAME}.md"
              gh issue create --title "$TITLE" --body-file "/tmp/issue-body-${GAME}.md" --label "autopatch" || \
                gh issue create --title "$TITLE" --body-file "/tmp/issue-body-${GAME}.md"
              echo "$GAME: issue 起票（人間承認待ち）"
            else
              echo "$GAME noop: $(jq -r '.reason // ""' "$f")"
            fi
          done

          if [ "$changed" != "true" ]; then
            echo "patch差分なし→スキップ"; exit 0
          fi

          git config user.name  "reflex-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reflex/game-config.js reflex/PATCHNOTES.md \
                  hiragana/game-config.js hiragana/PATCHNOTES.md
          if git diff --cached --quiet; then
            echo "差分なし→スキップ"; exit 0
          fi
          SUMMARY=$(jq -r '.summary // empty' reflex/decision.json 2>/dev/null || true)
          HIRA_SUMMARY=$(jq -r '.summary // empty' hiragana/decision.json 2>/dev/null || true)
          git commit \
            -m "auto: balance/text patch for games" \
            -m "reflex: ${SUMMARY:-no change}" \
            -m "hiragana: ${HIRA_SUMMARY:-no change}" \
            -m "Co-Authored-By: reflex-lab autopatch loop <actions@users.noreply.github.com>"
          # gate/verify を通過した小修正 → main へ直接コミット → Vercel が本番デプロイ。
          # 監査証跡は main のコミット + PATCHNOTES.md + Turso patch_log。
          git push origin HEAD:main
          echo "main へコミット → Vercel が本番デプロイ"
